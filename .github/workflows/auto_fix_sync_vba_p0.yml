name: Auto Fix Sync VBA P0

on:
  push:
    branches: [ codex-fix-sync-vba-p0 ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove parser-breaking test line
        shell: pwsh
        run: |
          $path = 'Sync-VBA.ps1'
          $bad = 'dfsd' + ' sd e3'
          $text = [System.IO.File]::ReadAllText($path, [System.Text.Encoding]::UTF8)
          $newText = $text.Replace("`r`n$bad`r`n", "`r`n")
          $newText = $newText.Replace("`n$bad`n", "`n")
          if ($newText -eq $text) {
            Write-Host 'No target line found.'
          } else {
            $encoding = [System.Text.UTF8Encoding]::new($true)
            [System.IO.File]::WriteAllText($path, $newText, $encoding)
          }

      - name: Remove one-time workflow
        shell: pwsh
        run: git rm .github/workflows/auto_fix_sync_vba_p0.yml

      - name: Commit and push
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sync-VBA.ps1
          if (git diff --cached --quiet) {
            Write-Host 'No changes to commit.'
          } else {
            git commit -m 'Fix Sync-VBA parser-breaking test line'
            git push
          }
